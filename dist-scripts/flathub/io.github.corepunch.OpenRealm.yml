app-id: io.github.corepunch.OpenRealm
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: openrealm-start

finish-args:
  - --device=all
  - --device=dri
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --share=network

  # Optional Steam shortcut/controller-profile integration. Retail Warcraft III
  # data is intentionally NOT covered by filesystem permissions; it is selected
  # through the XDG FileChooser portal instead. Debian/Ubuntu Steam installs use
  # ~/.steam/debian-installation (with ~/.steam/steam as a symlink), so expose
  # ~/.steam for the opt-in shortcut/artwork/controller-config integration.
  - --filesystem=~/.steam:rw
  - --filesystem=xdg-data/Steam/userdata:rw
  - --filesystem=~/.var/app/com.valvesoftware.Steam/data/Steam/userdata:rw
  - --filesystem=xdg-data/Steam/controller_base:ro
  - --filesystem=~/.var/app/com.valvesoftware.Steam/data/Steam/controller_base:ro
  - "--filesystem=xdg-data/Steam/steamapps/common/Steam Controller Configs:rw"
  - "--filesystem=~/.var/app/com.valvesoftware.Steam/data/Steam/steamapps/common/Steam Controller Configs:rw"

cleanup:
  - '*.a'
  - '*.la'
  - /include
  - /share/man
  - /share/doc

modules:
  - name: openrealm
    buildsystem: simple
    build-commands:
      - make clean
      - make -j${FLATPAK_BUILDER_N_JOBS} BUILD=release GL_BACKEND=gl MSAA=0 openwarcraft3

      - install -d /app/bin /app/lib /app/share/openrealm
      - install -Dm755 build/bin/openwarcraft3 /app/bin/openwarcraft3
      - install -m755 build/lib/libshared.so build/lib/libjass.so build/lib/libsheet.so build/lib/librenderer.so build/lib/libgame.so build/lib/libmenu.so /app/lib/
      - cp -a build/share/. /app/share/

      - install -Dm755 dist-scripts/flathub/openrealm-start /app/bin/openrealm-start
      - install -Dm755 dist-scripts/flathub/steam_shortcut.py /app/bin/steam_shortcut.py
      - SDL2_PC=sdl2-compat; pkg-config --exists "$SDL2_PC" || SDL2_PC=sdl2; cc -O2 -Wall -Wextra -o /app/bin/openrealm-flatpak-helper dist-scripts/flathub/openrealm-flatpak-helper.c $(pkg-config --cflags --libs gio-2.0 "$SDL2_PC")

      # Reuse repository-owned OpenRealm artwork. Steam crops these source
      # images to its grid/hero slots; no retail Warcraft artwork is packaged.
      - install -Dm644 docs/images/openrealm.png /app/share/openrealm/steam-grid.png
      - install -Dm644 docs/images/openrealm.png /app/share/openrealm/steam-hero.png
      - |
        cc -O2 -I. -o /tmp/openrealm-square-icon dist-scripts/flathub/make-square-icon.c -lm
        /tmp/openrealm-square-icon docs/images/openrealm.png /app/share/openrealm/${FLATPAK_ID}.png

      - install -d /app/share/icons/hicolor/512x512/apps
      - install -Dm644 /app/share/openrealm/${FLATPAK_ID}.png /app/share/icons/hicolor/512x512/apps/${FLATPAK_ID}.png
      - install -Dm644 dist-scripts/flathub/io.github.corepunch.OpenRealm.desktop /app/share/applications/io.github.corepunch.OpenRealm.desktop
      - install -Dm644 dist-scripts/flathub/io.github.corepunch.OpenRealm.metainfo.xml /app/share/metainfo/io.github.corepunch.OpenRealm.metainfo.xml
      - install -Dm644 LICENSE /app/share/licenses/${FLATPAK_ID}/LICENSE
      - install -Dm644 dist-scripts/flathub/licenses/steam_shortcut_LICENSE.txt /app/share/licenses/${FLATPAK_ID}/steam-shortcut/LICENSE.txt

    sources:
      - type: dir
        path: ../..
