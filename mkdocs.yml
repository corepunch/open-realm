site_name: OpenWarcraft3
site_url: https://corepunch.github.io/openwarcraft3/
site_description: Open-source Warcraft III implementation using SDL2, running on Linux and macOS.
site_author: corepunch
repo_url: https://github.com/corepunch/openwarcraft3
repo_name: corepunch/openwarcraft3
edit_uri: edit/main/doc/
docs_dir: doc

theme:
  name: material
  palette:
    - scheme: slate
      primary: deep orange
      accent: orange
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy

nav:
  - Home: index.md
  - Games:
    - Warcraft III:
      - Overview: games/warcraft-3/readme.md
      - File Formats:
        - 'Map (W3M/W3X)': games/warcraft-3/docs/file-formats/map.md
        - 'Model (MDX)': games/warcraft-3/docs/file-formats/mdx.md
        - 'SLK Spreadsheet': games/warcraft-3/docs/file-formats/slk.md
        - 'UI Frame Definition (FDF)': games/warcraft-3/docs/file-formats/fdf.md
      - Detailed File Notes:
        - Overview: games/warcraft-3/docs/file-docs/readme.md
        - MPQ Archive: games/warcraft-3/docs/file-docs/mpq.md
        - 'W3M / W3X Container': games/warcraft-3/docs/file-docs/w3x-w3m.md
        - Terrain W3E: games/warcraft-3/docs/file-docs/w3e.md
        - Doodads DOO: games/warcraft-3/docs/file-docs/doo.md
        - 'Shadow / Pathing': games/warcraft-3/docs/file-docs/shd-wpm.md
        - FDF Reference: games/warcraft-3/docs/file-docs/fdf.md
      - Implementation:
        - UI System: games/warcraft-3/docs/architecture/ui.md
        - UI Flow: games/warcraft-3/docs/architecture/ui-flow.md
        - UI Quick Reference: games/warcraft-3/docs/architecture/ui-quick-reference.md
        - Map Renderer: games/warcraft-3/docs/architecture/map-renderer.md
        - Ability Coverage: games/warcraft-3/docs/architecture/ability-coverage.md
        - ROC Ability Checklist: games/warcraft-3/docs/architecture/roc-ability-checklist.md
        - Cinematics: games/warcraft-3/docs/cinematics.md
        - Sounds: games/warcraft-3/docs/sounds.md
    - World of Warcraft:
      - Overview: games/world-of-warcraft/readme.md
      - Data Loading: games/world-of-warcraft/docs/data-loading.md
      - File Formats: games/world-of-warcraft/docs/file-formats.md
      - Terrain And World Rendering: games/world-of-warcraft/docs/terrain-and-world-rendering.md
      - M2 And Character Display: games/world-of-warcraft/docs/m2-and-character-display.md
      - References: games/world-of-warcraft/docs/references.md
      - Gameplay:
        - Enemies And Creatures: games/world-of-warcraft/docs/enemies-and-creatures.md
        - Magic And Effects: games/world-of-warcraft/docs/magic-and-effects.md
        - Weapons And Classes: games/world-of-warcraft/docs/weapons-and-classes.md
        - Spawn And Teleport: games/world-of-warcraft/docs/spawn-and-teleport.md
        - Quest UI: games/world-of-warcraft/docs/quest-ui.md
      - Rendering:
        - Grass Rendering System: games/world-of-warcraft/docs/grass-rendering-system.md
        - Sounds: games/world-of-warcraft/docs/sounds.md
    - StarCraft II:
      - Overview: games/starcraft-2/readme.md
      - Model Format (M3): games/starcraft-2/docs/file-formats/m3.md
      - Map Storage And Loading: games/starcraft-2/docs/map-storage-and-loading.md
      - Embedded Map Files: games/starcraft-2/docs/embedded-map-files.md
      - Map, Model, And Unit Data: games/starcraft-2/docs/map-model-unit-data.md
      - Parser Notes: games/starcraft-2/docs/parser-notes.md
      - HUD Layout Pipeline: games/starcraft-2/docs/hud-layout-pipeline.md
      - References: games/starcraft-2/docs/references.md
      - Sounds: games/starcraft-2/docs/sounds.md
      - File Format Details:
        - MapInfo: games/starcraft-2/docs/file-formats/mapinfo.md
        - PlacedObjects: games/starcraft-2/docs/file-formats/objects.md
        - Actors And Models: games/starcraft-2/docs/file-formats/actors-and-models.md
        - Assets.txt: games/starcraft-2/docs/file-formats/assets-txt.md
  - Architecture:
    - Client: architecture/client.md
    - Server: architecture/server.md
    - Network: architecture/network.md
    - Runtime Modules and Cvars: architecture/runtime.md
    - UI System: architecture/ui-system.md
    - Sound: architecture/sound.md
    - Fog of War Algorithms: architecture/fog-of-war-algorithms.md
  - Renderer Backend: renderer-backend.md

markdown_extensions:
  - tables
  - fenced_code
  - attr_list
  - md_in_html
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
