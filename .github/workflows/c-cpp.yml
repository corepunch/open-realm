name: C/C++ CI

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          for attempt in 1 2 3 4 5; do
            echo "apt attempt $attempt"
            if timeout 180 sudo apt-get update && \
               sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
                 libgles2-mesa-dev \
                 libsdl2-dev \
                 libjpeg-dev; then
              exit 0
            fi
            sleep 15
          done
          exit 1

      - name: Run unit tests
        run: make test

      - name: Prepare JUnit artifact
        if: ${{ !cancelled() }}
        run: |
          mkdir -p build/tests/junit
          printf 'workflow_run=%s\nhead_sha=%s\n' \
            "$GITHUB_RUN_ID" "$GITHUB_SHA" > build/tests/junit/run-info.txt

      - name: Upload JUnit reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: junit-test-results
          path: build/tests/junit/
          if-no-files-found: error
          retention-days: 7

  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          for attempt in 1 2 3 4 5; do
            echo "apt attempt $attempt"
            if timeout 180 sudo apt-get update && \
               sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
                 libgles2-mesa-dev \
                 libsdl2-dev \
                 libjpeg-dev; then
              exit 0
            fi
            sleep 15
          done
          exit 1

      - name: Build
        run: make

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openwarcraft3-linux-x64
          path: |
            build/bin/openwarcraft3
            build/lib/
            build/share/
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-libepoxy
            make

      - name: Build
        shell: msys2 {0}
        run: make

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openwarcraft3-windows-x64
          path: |
            build/bin/openwarcraft3.exe
            build/lib/
            build/share/
          if-no-files-found: error
