name: CI

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/corepunch/open-realm-ci:ubuntu-24.04
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v4

      - name: Run unit tests
        run: make test

  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/corepunch/open-realm-ci:ubuntu-24.04
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: make

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openwarcraft3-linux-x64
          path: |
            build/bin/openwarcraft3
            build/lib/
            build/share/
          if-no-files-found: error

  temporary-build-matrix:
    name: Build ${{ matrix.os }} ${{ matrix.mode }}
    if: github.event_name == 'pull_request' && github.head_ref == 'refactor/native-c-types'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        mode: [debug, release]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ca-certificates git libgles2-mesa-dev \
            libjpeg-dev libsdl2-dev pkg-config python3 zlib1g-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install sdl2 libjpeg

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-libepoxy
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-python
            make
            zip

      - name: Build Warcraft III, WoW, and SC2 (Unix)
        if: runner.os != 'Windows'
        run: make BUILD=${{ matrix.mode }} build openwow opensc2

      - name: Build Warcraft III, WoW, and SC2 (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: make BUILD=${{ matrix.mode }} build openwow opensc2
