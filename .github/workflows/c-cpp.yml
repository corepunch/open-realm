name: C/C++ CI

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          for attempt in 1 2 3 4 5; do
            echo "apt attempt $attempt"
            if timeout 180 sudo apt-get update && \
               sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
                 libgles2-mesa-dev \
                 libsdl2-dev \
                 libjpeg-dev; then
              exit 0
            fi
            sleep 15
          done
          exit 1

      - name: Run unit tests
        run: make test

  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          for attempt in 1 2 3 4 5; do
            echo "apt attempt $attempt"
            if timeout 180 sudo apt-get update && \
               sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
                 libgles2-mesa-dev \
                 libsdl2-dev \
                 libjpeg-dev; then
              exit 0
            fi
            sleep 15
          done
          exit 1

      - name: Build
        run: make

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openwarcraft3-linux-x64
          path: |
            build/bin/openwarcraft3
            build/lib/
          if-no-files-found: error
