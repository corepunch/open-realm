name: JUnit Test Report

on:
  workflow_run:
    workflows: ["C/C++ CI"]
    types: [completed]

permissions:
  actions: read
  checks: write

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion != 'cancelled' }}
    runs-on: ubuntu-latest

    steps:
      # This workflow is privileged. Do not checkout or execute code from the
      # triggering workflow, because pull_request runs may originate from forks.
      - name: Download JUnit reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: junit-test-results
          path: ${{ runner.temp }}/junit-test-results
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Publish unit test report
        uses: mikepenz/action-junit-report@d9f48fc87bc235f7e214acf696ca5abc0a986f16 # v6.4.2
        with:
          check_name: OpenRealm Unit Tests
          commit: ${{ github.event.workflow_run.head_sha }}
          report_paths: ${{ runner.temp }}/junit-test-results/*.xml
          fail_on_failure: false
          fail_on_parse_error: true
          require_tests: true
