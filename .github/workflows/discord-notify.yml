name: Discord Notify

on:
  # pull_request_target (not pull_request) so fork PRs still see
  # DISCORD_WEBHOOK_URL. Safe: this job never checks out code.
  pull_request_target:
    types: [opened, ready_for_review]

permissions:
  contents: read

jobs:
  notify:
    # Drafts announce once, when marked ready; bot PRs never post.
    if: github.event.pull_request.draft == false && github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    steps:
      - name: Post compact title card
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_AVATAR: ${{ github.event.pull_request.user.avatar_url }}
          PR_AUTHOR_URL: ${{ github.event.pull_request.user.html_url }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then echo "DISCORD_WEBHOOK_URL not set, skipping."; exit 0; fi
          TITLE="#$PR_NUMBER: $PR_TITLE"; URL="$PR_URL"
          # Summary: first paragraph of the body (headings, comments and the
          # Claude Code footer dropped), cut at a word boundary to ~200 chars.
          jq -n --arg author "$PR_AUTHOR" --arg avatar "$PR_AVATAR" --arg author_url "$PR_AUTHOR_URL" --arg title "$TITLE" --arg url "$URL" --arg body "$PR_BODY" \
            '($body | gsub("<!--[\\s\\S]*?-->"; "") | gsub("\r"; "") | split("\n\n")
              | map(split("\n") | map(select(test("^\\s*#|Generated with \\[Claude") | not) | sub("^\\s*[-*]\\s+"; ""))
                    | join(" ") | gsub("\\s+"; " ") | sub("^ | $"; ""; "g"))
              | map(select(length > 0)) | first // ""
              | if length > 200 then (.[0:200] | sub(" \\S*$"; "")) + "…" else . end) as $summary
            | {embeds: [{author: {name: $author, url: $author_url, icon_url: $avatar}, title: ($title | .[0:256]), url: $url, color: 3066993}
                + (if $summary == "" then {} else {description: $summary} end)], allowed_mentions: {parse: []}}' \
            | curl -sS --fail-with-body --connect-timeout 10 --max-time 30 \
                -X POST -H "Content-Type: application/json" -d @- "$DISCORD_WEBHOOK_URL"
