name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to attach assets to (e.g. v0.0.1-alpha)'
        required: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x64
            archive: openwarcraft3-linux-x64.tar.gz
          - os: macos-latest
            name: macos-x64
            archive: openwarcraft3-macos-x64.tar.gz
          - os: windows-latest
            name: windows-x64
            archive: openwarcraft3-windows-x64.zip

    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
      packages: read

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          # Keep releases independent of the asynchronously published shared CI image.
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            git \
            libgles2-mesa-dev \
            libjpeg-dev \
            libsdl2-dev \
            pkg-config \
            python3 \
            zlib1g-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install sdl2 libjpeg

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-libepoxy
            mingw-w64-x86_64-zlib
            make
            zip

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: make build

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: make build

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: make build

      - name: Create release archive (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p release
          cp build/bin/openwarcraft3 release/
          cp -r build/lib/. release/
          cp -r build/share release/
          tar -czf ${{ matrix.archive }} -C release .

      - name: Create release archive (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          mkdir -p release
          cp build/bin/openwarcraft3.exe release/
          cp -r build/lib/. release/
          cp -r build/share release/
          # Bundle the MinGW runtime closure (SDL2, zlib, libepoxy plus
          # transitive deps like libgcc/libwinpthread) beside the exe: a
          # clean Windows install has no MSYS2. Fails the job when a
          # dependency is unresolved or a required DLL is absent (issue #462).
          bash dist-scripts/windows/bundle_mingw_dlls.sh release \
            build/bin/openwarcraft3.exe build/lib/*.dll
          cd release && zip -r ../${{ matrix.archive }} .

      - name: Determine release tag
        id: get_tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release upload "${{ steps.get_tag.outputs.tag }}" \
            "${{ matrix.archive }}" \
            --clobber

  flatpak-build:
    name: Build Flatpak
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged

    steps:
      - uses: actions/checkout@v4

      - name: Prepare Flatpak output directory
        run: mkdir -p build

      - name: Build Flatpak bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3
        with:
          manifest-path: dist-scripts/flathub/io.github.corepunch.OpenRealm.yml
          bundle: build/io.github.corepunch.OpenRealm.flatpak
          arch: x86_64
          cache: true
          restore-cache: true
          save-cache: true
          upload-artifact: false

      - name: Upload Flatpak release inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openrealm-flatpak-release-inputs
          path: |
            build/io.github.corepunch.OpenRealm.flatpak
            dist-scripts/flathub/install.sh
            dist-scripts/flathub/uninstall.sh
          if-no-files-found: error
          retention-days: 1

  flatpak-release:
    name: Publish Flatpak
    needs: flatpak-build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write

    steps:
      - name: Download Flatpak release inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: openrealm-flatpak-release-inputs
          path: release-flatpak

      - name: Determine release tag
        id: get_tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW_TAG="${{ github.event.inputs.tag }}"
          else
            RAW_TAG="${{ github.ref_name }}"
          fi
          SAFE_TAG="$(printf '%s' "$RAW_TAG" | sed 's#[^A-Za-z0-9._-]#-#g')"
          echo "tag=$RAW_TAG" >> "$GITHUB_OUTPUT"
          echo "safe_tag=$SAFE_TAG" >> "$GITHUB_OUTPUT"

      - name: Assemble Flatpak installer package
        shell: bash
        run: |
          python3 - <<'PYZIP'
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile

          root = Path("release-flatpak")
          output = root / "openrealm-flatpak-${{ steps.get_tag.outputs.safe_tag }}.zip"
          files = [
              root / "build/io.github.corepunch.OpenRealm.flatpak",
              root / "dist-scripts/flathub/install.sh",
              root / "dist-scripts/flathub/uninstall.sh",
          ]
          with ZipFile(output, "w", ZIP_DEFLATED) as archive:
              for path in files:
                  archive.write(path, path.name)
          PYZIP

      - name: Upload Flatpak release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ steps.get_tag.outputs.tag }}" \
            release-flatpak/build/io.github.corepunch.OpenRealm.flatpak \
            "release-flatpak/openrealm-flatpak-${{ steps.get_tag.outputs.safe_tag }}.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
