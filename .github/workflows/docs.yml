name: Deploy Docs

on:
  push:
    branches: ["main"]
    paths:
      - "README.md"
      - "docs/**"
      - "games/**"
      - "client/**"
      - "common/**"
      - "renderer/**"
      - "server/**"
      - "shared/**"
      - "sound/**"
      - "vendor/**"
      - "tools/**"
      - "port/web/**"
      - "share/**"
      - "Makefile"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install MkDocs
        run: pip install mkdocs-material
      - name: Setup Pages
        uses: actions/configure-pages@v4
      # The browser engine uses pthreads, WasmFS and OffscreenCanvas; this
      # must be the actual static engine target, not the foundation probe.
      - name: Set up Emscripten
        uses: emscripten-core/setup-emsdk@v16
        with:
          version: "4.0.21"
      - name: Prepare embedded font
        run: make font
      - name: Build Warcraft III browser engine
        run: make web-warcraft3-engine
      - name: Build with MkDocs
        run: mkdocs build
      - name: Package browser game into Pages artifact
        run: python3 port/web/publish-pages.py build/web/engine site/play
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
