// unu controller (generic Bluetooth HID gamepad, VID 294b PID 1001).
// SDL has no mapping for it, so its raw buttons arrive as AUX1..AUX12 (button
// index + 1). Copy this file as pad_<vendor><product>.cfg for another pad.
bind AUX1 "+select"
bind AUX2 "+cancel"
bind AUX3 "+smart"
bind AUX4 "+radial"
bind AUX5 "+statuspanel"
bind AUX6 "+selectvisible"
bind AUX7 "+selectremove"
bind AUX8 "+selectadd"
bind AUX9 "+escape"
bind AUX10 "+system"
bind AUX12 "zoomdefault"
// Quake 2 style axis map: joy_advaxis<raw axis> = 1 forward (left stick Y),
// 2 pitch (right stick Y, zoom), 3 side (left stick X), 4 yaw (right stick X).
set joy_name "unu controller"
set joy_advaxis0 "3"
set joy_advaxis1 "1"
set joy_advaxis2 "4"
set joy_advaxis5 "2"
