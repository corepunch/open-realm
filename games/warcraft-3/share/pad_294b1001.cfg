// unu controller (generic Bluetooth HID gamepad, VID 294b PID 1001).
// SDL has no mapping for it, so its raw buttons arrive as AUX1..AUX12 (button
// index + 1). Copy this file as pad_<vendor><product>.cfg for another pad.
bind AUX1 "+gp_a"
bind AUX2 "+gp_b"
bind AUX3 "+gp_x"
bind AUX4 "+gp_y"
bind AUX5 "+gp_lb"
bind AUX6 "+gp_rb"
bind AUX7 "+gp_lt"
bind AUX8 "+gp_rt"
bind AUX9 "+gp_back"
bind AUX10 "+gp_start"
bind AUX12 "+gp_rstick"
// Raw axis index of each stick; the hat is the D-pad.
set cl_joy_axis_leftx "0"
set cl_joy_axis_lefty "1"
set cl_joy_axis_rightx "2"
set cl_joy_axis_righty "5"
