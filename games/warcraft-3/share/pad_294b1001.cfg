// unu controller (generic Bluetooth HID gamepad, VID 294b PID 1001).
// SDL has no mapping for it, so it is used raw, Quake 2 style: buttons 0-3 are
// JOY1-JOY4, the rest AUX5-AUX32 (button index + 1), the POV hat is AUX29-AUX32.
// Copy this file as pad_<vendor><product>.cfg for another pad.
set joy_name "unu controller"
bind JOY1 "+select"
bind JOY2 "+cancel"
bind JOY3 "+smart"
bind JOY4 "+radial"
bind AUX5 "+statuspanel"
bind AUX6 "+selectvisible"
bind AUX7 "+selectremove"
bind AUX8 "+selectadd"
bind AUX9 "+escape"
bind AUX10 "+system"
bind AUX12 "zoomdefault"
bind AUX29 "+dpadup"
bind AUX30 "+dpadright"
bind AUX31 "+dpaddown"
bind AUX32 "+dpadleft"
// Axes: 1 forward (left Y), 2 pitch (right Y, zoom), 3 side (left X), 4 yaw (right X).
set joy_advanced "1"
set joy_advaxis0 "3"
set joy_advaxis1 "1"
set joy_advaxis2 "4"
set joy_advaxis5 "2"
set joy_forwardthreshold "0.15"
set joy_sidethreshold "0.15"
set joy_pitchthreshold "0.15"
set joy_yawthreshold "0.15"
joy_advancedupdate
