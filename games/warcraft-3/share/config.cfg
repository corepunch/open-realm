// OpenWarcraft3 gameplay defaults (installed to build/share/warcraft-3/).
// User overrides are written to ~/.warcraft-3/config.cfg.

// 1024x768 default window; writeconfig persists a per-user override.
seta vid_mode "2"

bind MOUSE1 "+select"
bind MOUSE2 "+smart"
bind MOUSE3 "+pan"
bind ALT+MOUSE1 "+pan"
bind q "cmd quests"
bind ESCAPE "cmd cancel"
bind F10 "screenshot"
