set cl_camera_min_pitch "-85"
set cl_camera_max_pitch "-5"
set cl_selection_limit "64"
set cl_same_type_select "1"
set cl_group_focus "1"
// Shared controls; game defaults choose bindings and independent options.
set cl_start_menu "menu_main"
seta cl_camera_scroll_speed "1400"
seta cl_camera_edge_scroll "1"
set cl_camera_pan_plane "0"
// Authored Normal/Scroll cursor sequences supply retail mouse-edge feedback.
set r_cursor "1"
// Retail activates edge scrolling at the outermost client pixel.
set cl_camera_edge_margin "0"
cvar_alias wc3_camera_edge_scroll cl_camera_edge_scroll

// OpenWarcraft3 gameplay defaults (installed to build/share/warcraft-3/).
// Reforged-style player camera zoom.  Maps may override these values through W3I force-zoom flags.
seta wc3_camera_default_distance "1650"
seta wc3_camera_max_distance "3000"
// One wheel/key notch changes target distance by 100 world units; keep the
// magnitude configurable independently of the retail min/default/max policy.
seta zoom_speed "100"

// User overrides are written to $XDG_DATA_HOME/warcraft-3/config.cfg (or ~/.local/share/warcraft-3/config.cfg).

// Prefer the current desktop resolution in fullscreen mode. On Steam Deck this is
// 1280x800. vid_mode remains the fallback when vid_native is disabled.
seta vid_native "1"
seta vid_fullscreen "1"
// 1280x720 widescreen default; writeconfig persists a per-user override.
seta vid_mode "4"

// The engine keeps optional expansion archives mounted; RoC hides this family
// from lookup so the main-menu Edition button can switch without remounting MPQs.
set fs_expansion_archive_prefix "War3x"

// Campaign selection defaults to the compatibility/developer view. Set to
// "unlocked" to show only campaigns and missions made available by campaign progress.
seta wc3_campaign_visibility "all"

// Minimap signal overlay: click a world/minimap point; Esc/right click restores the command.
bind ALT+G "cmd signal"
bind MOUSE1 "+select"
bind MOUSE2 "+smart"
bind MOUSE3 "+pan"
bind ALT+MOUSE1 "+pan"
bind LEFTARROW "+camwest"
bind RIGHTARROW "+cameast"
bind UPARROW "+camnorth"
bind DOWNARROW "+camsouth"
bind MWHEELUP "zoom 1"
bind MWHEELDOWN "zoom -1"
bind PAGEUP "zoomkey 1"
bind PAGEDOWN "zoomkey -1"
bind SPACE "cmd quickcamera"
bind TAB "cmd cyclesubgroup"
bind q "cmd quests"
bind ESCAPE "cmd cancel"
bind F1 "cmd herokey 0"
bind F2 "cmd herokey 1"
bind F3 "cmd herokey 2"
bind F4 "cmd herokey 3"
bind F5 "zoomdefault"
bind F6 "save quick"
bind F8 "cmd idleworker"
bind F9 "cmd quests"
bind F10 "cmd menu"
bind F11 "cmd allies"
bind F12 "screenshot"

// Control groups: 0-9 recall, SHIFT+N append, CTRL+N assign.
bind 0 "group 0"
bind 1 "group 1"
bind 2 "group 2"
bind 3 "group 3"
bind 4 "group 4"
bind 5 "group 5"
bind 6 "group 6"
bind 7 "group 7"
bind 8 "group 8"
bind 9 "group 9"
bind SHIFT+0 "group add 0"
bind SHIFT+1 "group add 1"
bind SHIFT+2 "group add 2"
bind SHIFT+3 "group add 3"
bind SHIFT+4 "group add 4"
bind SHIFT+5 "group add 5"
bind SHIFT+6 "group add 6"
bind SHIFT+7 "group add 7"
bind SHIFT+8 "group add 8"
bind SHIFT+9 "group add 9"
bind CTRL+0 "group assign 0"
bind CTRL+1 "group assign 1"
bind CTRL+2 "group assign 2"
bind CTRL+3 "group assign 3"
bind CTRL+4 "group assign 4"
bind CTRL+5 "group assign 5"
bind CTRL+6 "group assign 6"
bind CTRL+7 "group assign 7"
bind CTRL+8 "group assign 8"
bind CTRL+9 "group assign 9"
bind CTRL+SHIFT+0 "group assign 0"
bind CTRL+SHIFT+1 "group assign 1"
bind CTRL+SHIFT+2 "group assign 2"
bind CTRL+SHIFT+3 "group assign 3"
bind CTRL+SHIFT+4 "group assign 4"
bind CTRL+SHIFT+5 "group assign 5"
bind CTRL+SHIFT+6 "group assign 6"
bind CTRL+SHIFT+7 "group assign 7"
bind CTRL+SHIFT+8 "group assign 8"
bind CTRL+SHIFT+9 "group assign 9"
