// OpenWarcraft3 gameplay defaults (installed to build/share/warcraft-3/).
// User overrides are written to ~/.local/share/warcraft-3/config.cfg.

// 1024x768 default window; writeconfig persists a per-user override.
seta vid_mode "2"

bind MOUSE1 "+select"
bind MOUSE2 "+smart"
bind MOUSE3 "+pan"
bind ALT+MOUSE1 "+pan"
bind q "cmd quests"
bind ESCAPE "cmd cancel"
bind F1 "cmd herokey 0"
bind F2 "cmd herokey 1"
bind F3 "cmd herokey 2"
bind F4 "cmd herokey 3"
bind F6 "save quick"
bind F8 "cmd idleworker"
bind F9 "cmd quests"
bind F10 "cmd menu"
bind F11 "cmd allies"
bind F12 "screenshot"
