// OpenWarcraft3 gameplay defaults (installed to build/share/warcraft-3/).
// User overrides are written to ~/.warcraft-3/config.cfg.

// 1024x768 default window; writeconfig persists a per-user override.
seta vid_mode "2"

bind MOUSE1 "+select"
bind MOUSE2 "+smart"
bind MOUSE3 "+pan"
bind ALT+MOUSE1 "+pan"
bind q "cmd quests"
bind ESCAPE "cmd cancel"
bind F1 "herokey 0"
bind F2 "herokey 1"
bind F3 "herokey 2"
bind F4 "herokey 3"
bind F5 "herokey 4"
bind F6 "herokey 5"
bind F7 "herokey 6"
bind F8 "idleworker"
bind F9 "cmd quests"
bind F10 "screenshot"
bind F11 "cmd allies"
bind F12 "cmd log"
