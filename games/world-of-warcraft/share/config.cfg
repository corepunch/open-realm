// OpenWoW gameplay defaults (installed to build/share/world-of-warcraft/).
// User overrides are written to ~/.world-of-warcraft/config.cfg.

// Match WC3's 1024x768 default instead of the engine's 640x480; user config still overrides this.
seta vid_mode "2"

bind MOUSE1 "+wowselect"
bind MOUSE2 "+look"
bind w "+forward"
bind s "+back"
bind a "+moveleft"
bind d "+moveright"
bind ESCAPE "cmd stopattack"
bind F10 "screenshot"

seta wow_mouse_speed "0.18"
seta wow_zoom_speed "1.0"
