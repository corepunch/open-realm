// OpenWoW gameplay defaults (installed to build/share/world-of-warcraft/).
// User overrides are written to ~/.local/share/world-of-warcraft/config.cfg.

// Match WC3's 1024x768 default instead of the engine's 640x480; user config still overrides this.
seta vid_mode "2"

bind MOUSE1 "+select"
bind MOUSE2 "+look"
bind MOUSE3 "+look"
bind MWHEELUP "zoom 1"
bind MWHEELDOWN "zoom -1"
bind w "+forward"
bind s "+back"
bind a "+moveleft"
bind d "+moveright"
bind TAB "cmd wow_cycle_target"
bind 1 "cmd wow_action 0"
bind 2 "cmd wow_action 1"
bind 3 "cmd wow_action 2"
bind 4 "cmd wow_action 3"
bind 5 "cmd wow_action 4"
bind 6 "cmd wow_action 5"
bind 7 "cmd wow_action 6"
bind 8 "cmd wow_action 7"
bind 9 "cmd wow_action 8"
bind 0 "cmd wow_action 9"
bind ESCAPE "cmd stopattack"
bind F10 "screenshot"

seta wow_mouse_speed "0.18"
seta zoom_speed "1.0"
seta camera_min_distance "5.5"
seta camera_max_distance "25.0"
