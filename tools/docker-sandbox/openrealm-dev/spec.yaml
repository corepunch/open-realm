schemaVersion: "2"
kind: mixin
name: openrealm-dev
displayName: OpenRealm development dependencies
description: Build, debug, binary-inspection, and headless Warcraft III dependencies for OpenRealm.

args:
  ffmpeg:
    default: "0"
    description: Install optional FFmpeg development libraries (0 or 1)
    enum:
      - "0"
      - "1"
  retail_tools:
    default: "0"
    description: Install optional Wine, Ghidra and Frida retail-analysis tools (0 or 1)
    enum:
      - "0"
      - "1"

setup:
  install:
    - description: Install OpenRealm development dependencies
      user: "0"
      command: |
        set -eu
        export DEBIAN_FRONTEND=noninteractive

        packages="
          build-essential
          gdb
          libsdl2-dev
          libgl-dev
          libegl1-mesa-dev
          zlib1g-dev
          pkg-config
          ca-certificates
          git
          radare2
          xvfb
          xauth
        "

        # Retail analysis needs a 32-bit Wine, a full JDK for Ghidra and several hundred MB of downloads;
        # keep it out of the default image so an unavailable package or release URL cannot break it.
        if [ "${{ kit.args.retail_tools }}" = "1" ]; then
          if ! dpkg --print-foreign-architectures | grep -qx i386; then
            dpkg --add-architecture i386
          fi
          packages="$packages
            wine
            wine64
            libwine:i386
            python3-venv
            curl
            unzip
            xz-utils
          "
        fi

        if [ "${{ kit.args.ffmpeg }}" = "1" ]; then
          packages="$packages
            libavformat-dev
            libavcodec-dev
            libavutil-dev
            libswscale-dev
            libswresample-dev
          "
        fi

        apt-get update
        apt-get install -y $packages

        if [ "${{ kit.args.retail_tools }}" = "1" ]; then
        tools_dir=/opt/openrealm-tools
        mkdir -p "$tools_dir"

        jdk_tar=/tmp/OpenJDK25U-jdk_x64_linux_hotspot_25.0.5_8.tar.gz
        curl -fL --retry 3 -o "$jdk_tar" \
          https://github.com/adoptium/temurin25-binaries/releases/download/jdk-25.0.5%2B8/OpenJDK25U-jdk_x64_linux_hotspot_25.0.5_8.tar.gz
        echo '68982529869257d0ee6b824ec5aa270ff8b118bb438670da0b97ebdab178d7fb  '"$jdk_tar" | sha256sum -c -
        tar -xzf "$jdk_tar" -C "$tools_dir"
        rm -f "$jdk_tar"

        ghidra_zip=/tmp/ghidra_12.2_PUBLIC_20261016.zip
        curl -fL --retry 3 -o "$ghidra_zip" \
          https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.2_build/ghidra_12.2_PUBLIC_20261016.zip
        echo '2c2cd776db3c1f6a097ba418922378ac3649cadd5e844a6f5f088ae628a7be67  '"$ghidra_zip" | sha256sum -c -
        unzip -q "$ghidra_zip" -d "$tools_dir"
        rm -f "$ghidra_zip"

        python3 -m venv "$tools_dir/frida-venv"
        "$tools_dir/frida-venv/bin/pip" install --no-cache-dir frida==17.19.0 frida-tools==14.10.4

        frida_server_xz=/tmp/frida-server-17.19.0-windows-x86_64.exe.xz
        curl -fL --retry 3 -o "$frida_server_xz" \
          https://github.com/frida/frida/releases/download/17.19.0/frida-server-17.19.0-windows-x86_64.exe.xz
        echo 'be25eb9741e13be13ce4e6620c54d43002204050eeda9d36d4f693664ccfda59  '"$frida_server_xz" | sha256sum -c -
        xz -dc "$frida_server_xz" > "$tools_dir/frida-server.exe"
        rm -f "$frida_server_xz"

        ln -sf "$tools_dir/frida-venv/bin/frida" /usr/local/bin/frida
        ln -sf "$tools_dir/frida-venv/bin/frida-ps" /usr/local/bin/frida-ps
        ln -sf "$tools_dir/frida-server.exe" /usr/local/bin/frida-server.exe
        cat > /usr/local/bin/ghidra <<'EOF'
        #!/bin/sh
        export JAVA_HOME=/opt/openrealm-tools/jdk-25.0.5+8
        exec /opt/openrealm-tools/ghidra_12.2_PUBLIC/ghidraRun "$@"
        EOF
        chmod 755 /usr/local/bin/ghidra

        /opt/openrealm-tools/jdk-25.0.5+8/bin/java -version
        /opt/openrealm-tools/jdk-25.0.5+8/bin/javac -version
        wine --version
        test -x /usr/local/bin/ghidra
        test -x /usr/local/bin/frida
        test -x /usr/local/bin/frida-ps
        test -x /usr/local/bin/frida-server.exe
        test -x /opt/openrealm-tools/ghidra_12.2_PUBLIC/ghidraRun
        /opt/openrealm-tools/frida-venv/bin/python -c 'import frida; assert frida.__version__ == "17.19.0"'
        fi

        apt-get clean
        rm -rf /var/lib/apt/lists/*
